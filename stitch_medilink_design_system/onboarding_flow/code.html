<style>

            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        .hide-slide {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
        .show-slide {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }

<!-- Indicators -->
<div class="flex justify-center items-center gap-2" id="indicators">
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-300" id="ind-1"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant transition-all duration-300" id="ind-2"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant transition-all duration-300" id="ind-3"></div>
</div>
<!-- Controls -->
<div class="flex justify-between items-center w-full">
<button class="font-label-lg text-label-lg text-on-surface-variant px-4 py-3 h-touch-target min-w-[80px] rounded-full hover:bg-surface-container-high transition-colors text-left" id="btn-skip" onclick="goToSlide(3)">
                Skip
            </button>
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-8 py-3 h-touch-target rounded-[16px] hover:opacity-90 transition-all flex items-center justify-center min-w-[120px] shadow-sm" id="btn-next" onclick="nextSlide()">
                Next
            </button>
<button class="hidden bg-primary text-on-primary font-label-lg text-label-lg px-8 py-3 h-touch-target rounded-[16px] hover:opacity-90 transition-all items-center justify-center w-full shadow-sm" id="btn-start" onclick="finishOnboarding()">
                Get Started
            </button>
</div>
</footer>
<script>
        let currentSlide = 1;
        const totalSlides = 3;

        function updateUI() {
            // Update Slides
            for (let i = 1; i <= totalSlides; i++) {
                const slide = document.getElementById(`slide-${i}`);
                if (i === currentSlide) {
                    slide.classList.remove('hide-slide');
                    slide.classList.add('show-slide');
                } else {
                    slide.classList.remove('show-slide');
                    slide.classList.add('hide-slide');
                }
            }

            // Update Indicators
            for (let i = 1; i <= totalSlides; i++) {
                const ind = document.getElementById(`ind-${i}`);
                if (i === currentSlide) {
                    ind.className = 'w-8 h-2 rounded-full bg-primary transition-all duration-300';
                } else {
                    ind.className = 'w-2 h-2 rounded-full bg-outline-variant transition-all duration-300';
                }
            }

            // Update Buttons
            const btnSkip = document.getElementById('btn-skip');
            const btnNext = document.getElementById('btn-next');
            const btnStart = document.getElementById('btn-start');

            if (currentSlide === totalSlides) {
                btnSkip.classList.add('hidden');
                btnNext.classList.add('hidden');
                btnStart.classList.remove('hidden');
                btnStart.classList.add('flex');
            } else {
                btnSkip.classList.remove('hidden');
                btnNext.classList.remove('hidden');
                btnStart.classList.add('hidden');
                btnStart.classList.remove('flex');
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateUI();
            }
        }

        function goToSlide(slideNum) {
            currentSlide = slideNum;
            updateUI();
        }

        function finishOnboarding() {
            // Usually redirect to home or login here
            console.log("Onboarding complete. Redirecting...");
        }
    </script>
