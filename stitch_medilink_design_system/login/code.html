<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-[400px] flex flex-col gap-lg bg-surface p-lg md:p-xl rounded-2xl shadow-sm md:shadow-md border border-outline-variant/30">
<!-- Header & Illustration -->
<header class="flex flex-col items-center text-center gap-md">
<div class="w-32 h-32 bg-primary-container/20 rounded-full flex items-center justify-center mb-sm overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A clean, modern, flat-vector illustration of a healthcare professional in a pristine medical setting. The illustration uses the primary medical green palette with soft, minimal lines, communicating trust, reliability, and clinical precision in a light-mode corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAaIf7Pi4W0cplq-mTe9LKMsN6F6d0xPDwwR6DBkm1criUJPCPA29NQEj5n_N27Oc_Y3Hbs6udnrPdHmpKfIxGKNvgDVkwxA7VPuAbbD2YV9D7vtcZJ9sk2ZGZ-CRoFnsiLW5AE_SJzYkAHRRGi9SAupHt_6J2xii_rowfXuX9IDS3Mp_oOeh9DxoE_zMQmJtP1d-v75Z6IQ53pB4hPHj5LXk7RJhd6os90rOe9p-Ce7MLw9thfiMW-Er25DIXJ_4xnH5y-LcNeb0b3"/>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">MediLink</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Sign in to your healthcare account</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md w-full">
<!-- Email/Phone Input -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<input class="w-full h-14 pl-10 pr-4 bg-surface-container-lowest border border-outline rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant/70" id="username" placeholder="Email or Phone Number" type="text"/>
</div>
<!-- Password Input -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
</div>
<input class="w-full h-14 pl-10 pr-12 bg-surface-container-lowest border border-outline rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant/70" id="password" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full">
<a class="font-label-lg text-label-lg text-primary font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-primary/20 rounded" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-[16px] font-title-md text-title-md hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center shadow-sm" type="submit">
                Login
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-md text-label-md">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Login -->
<button class="w-full h-[56px] bg-surface-container-lowest border border-outline text-on-surface rounded-[16px] font-title-md text-title-md hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="button">
<!-- Google Icon SVG minimal representation -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Create Account Link -->
<div class="text-center mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-title-md text-title-md text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary/20 rounded ml-xs" href="#">Create Account</a>
</p>
</div>
</main>
<!-- Contextual FAB Suppression: Login screen is transactional, FAB is suppressed as per instructions -->
<!-- Shell Visibility & Relevance: Navigation shell (TopAppBar/BottomNavBar) suppressed for Login screen as it is transactional -->
</body></html>
