<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .map-overlay-gradient {
            background: linear-gradient(to bottom, rgba(249, 249, 249, 0.9) 0%, rgba(249, 249, 249, 0) 30%, rgba(249, 249, 249, 0) 70%, rgba(249, 249, 249, 0.95) 100%);
        }
        
        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .7;
                transform: scale(1.1);
            }
        }
        
        /* Map pin drop animation */
        .pin-drop {
            animation: dropIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        
        @keyframes dropIn {
            0% {
                transform: translateY(-50px) scale(0);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        /* Bottom sheet slide up */
        .slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        
        @keyframes slideUp {
            0% {
                transform: translateY(100%);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased overflow-hidden h-screen w-full flex flex-col relative">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface z-50 shadow-sm flex items-center justify-between px-margin-mobile h-touch-target absolute top-0 left-0">
<button aria-label="Go back" class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Live Tracking</h1>
<div class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant">
<!-- Empty placeholder for balance -->
</div>
</header>
<!-- Map Container -->
<main class="flex-grow relative w-full h-full bg-surface-container-low overflow-hidden">
<!-- Base Map Image -->
<div class="absolute inset-0 w-full h-full">
<img alt="" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtEMF9fR18WjFSpzIwXNRxmQLQaCLSTOv4tRO3tCQS-TbyPbUwmaG85hjQMBtHC03UWTaDDyp-bt61oiWbBG8Zbqbe9cX1PGWNYJMwm7KGAPiD2ZMcfJ0RWCGVx2dGMDQ9r1SRW4cpVDJEY74KZMJxdwVD2xPgtmvcXYlkloLV5RmWELlGKHXDHxuroNydHDWg8bccVjKAIdsKzu68QTSI8qLwfzh_y-GFrjbA5RtzUClNC0-4fNI3-hxwp" style="object-position: center 30%;"/>
</div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 map-overlay-gradient pointer-events-none"></div>
<!-- Route Line (Simulated via SVG) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="opacity-70" d="M 30,70 C 40,60 50,55 50,40 C 50,25 60,30 70,20" fill="none" stroke="#006a5e" stroke-dasharray="2,2" stroke-width="0.8"></path>
<!-- Animated dash -->
<path d="M 30,70 C 40,60 50,55 50,40 C 50,25 60,30 70,20" fill="none" stroke="#006a5e" stroke-width="1.2">
<animate attributename="stroke-dasharray" dur="2s" repeatcount="indefinite" values="0,100; 100,0"></animate>
</path>
</svg>
<!-- Pharmacy Marker (Origin) -->
<div class="absolute top-[20%] left-[70%] transform -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center pin-drop" style="animation-delay: 0.1s;">
<div class="bg-surface px-3 py-1 rounded-full shadow-sm border border-outline-variant mb-1 font-label-md text-label-md text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">local_pharmacy</span>
<span>Lazz Pharma</span>
</div>
<div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center shadow-sm border-2 border-surface relative">
<span class="material-symbols-outlined text-on-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">storefront</span>
<div class="absolute -bottom-1 left-1/2 w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-t-[6px] border-t-primary transform -translate-x-1/2"></div>
</div>
</div>
<!-- Rider Marker (Current) -->
<div class="absolute top-[40%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 z-30 flex flex-col items-center pulse-animation pin-drop" style="animation-delay: 0.3s;">
<div class="bg-primary text-on-primary px-3 py-1 rounded-full shadow-sm mb-1 font-label-md text-label-md flex items-center gap-1">
<span>15 mins</span>
</div>
<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-primary relative">
<img alt="Rider Avatar" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtaMmeVZNEVl2mSM4AYA5cHR6gVkwEkMC7WUoZ0j-xNYx8Y0Qt8ejos_iVGZn7SdMDtQ4AqG5C3adtqpRmnM5eHkT-UQG78FXoGau6YoUuThJ70_x3bNjzCBlZgLV5_jDqKh7cGFlZLH23PeBiyjB2WCcOatcHZnN--JkWrHbyr6-bhXxH2eZj41UZj2k0Ig26zIrE-ODAcY0jHolqhLDVz-ZdSPdDrHhSS8QJvZ1tfNdOc14ucID3-CWwQ"/>
<div class="absolute -bottom-1.5 left-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-white transform -translate-x-1/2"></div>
<div class="absolute -bottom-2 left-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-primary transform -translate-x-1/2 -z-10"></div>
</div>
</div>
<!-- Customer Marker (Destination) -->
<div class="absolute top-[70%] left-[30%] transform -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center pin-drop" style="animation-delay: 0.5s;">
<div class="bg-surface px-3 py-1 rounded-full shadow-sm border border-outline-variant mb-1 font-label-md text-label-md text-on-surface">
                Home
            </div>
<div class="w-8 h-8 bg-tertiary rounded-full flex items-center justify-center shadow-sm border-2 border-surface relative">
<span class="material-symbols-outlined text-on-tertiary text-[18px]" style="font-variation-settings: 'FILL' 1;">home</span>
<div class="absolute -bottom-1 left-1/2 w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-t-[6px] border-t-tertiary transform -translate-x-1/2"></div>
</div>
</div>
<!-- Floating Current Location Button -->
<button class="absolute bottom-[300px] right-margin-mobile w-12 h-12 bg-surface rounded-full shadow-[0_4px_8px_rgba(0,0,0,0.15)] flex items-center justify-center text-primary z-40 hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">my_location</span>
</button>
</main>
<!-- Bottom Sheet (Delivery Details) -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-[24px] shadow-[0_-4px_16px_rgba(0,0,0,0.1)] z-50 slide-up flex flex-col pb-6">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full opacity-50"></div>
</div>
<div class="px-margin-mobile">
<!-- Header: Status & ETA -->
<div class="flex justify-between items-start mb-6">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Out for Delivery</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
                        Arriving in ~15 mins
                    </p>
</div>
<div class="bg-primary-container text-on-primary-container font-title-md text-title-md px-4 py-2 rounded-xl flex flex-col items-center justify-center">
<span class="text-2xl font-bold">15</span>
<span class="font-label-md text-label-md">min</span>
</div>
</div>
<!-- Timeline Tracker -->
<div class="flex items-center w-full mb-6 px-2">
<!-- Step 1: Preparing (Done) -->
<div class="flex flex-col items-center flex-1 relative">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center z-10">
<span class="material-symbols-outlined text-[14px] text-on-primary font-bold">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-center">Preparing</span>
</div>
<!-- Line 1 -->
<div class="h-[2px] flex-1 bg-primary -mx-4 z-0 self-start mt-3"></div>
<!-- Step 2: Picked Up (Done) -->
<div class="flex flex-col items-center flex-1 relative">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center z-10">
<span class="material-symbols-outlined text-[14px] text-on-primary font-bold">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 text-center">Picked Up</span>
</div>
<!-- Line 2 -->
<div class="h-[2px] flex-1 bg-primary -mx-4 z-0 self-start mt-3"></div>
<!-- Step 3: Out for Delivery (Active) -->
<div class="flex flex-col items-center flex-1 relative">
<div class="w-6 h-6 rounded-full bg-primary border-4 border-primary-container flex items-center justify-center z-10 pulse-animation"></div>
<span class="font-label-md text-label-md text-primary font-semibold mt-2 text-center">On Way</span>
</div>
</div>
<!-- Rider Info Card -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center gap-4 mb-6 border border-outline-variant/30">
<img alt="Tanvir Ahmed Profile" class="w-[56px] h-[56px] rounded-full object-cover border-2 border-surface shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLtaMmeVZNEVl2mSM4AYA5cHR6gVkwEkMC7WUoZ0j-xNYx8Y0Qt8ejos_iVGZn7SdMDtQ4AqG5C3adtqpRmnM5eHkT-UQG78FXoGau6YoUuThJ70_x3bNjzCBlZgLV5_jDqKh7cGFlZLH23PeBiyjB2WCcOatcHZnN--JkWrHbyr6-bhXxH2eZj41UZj2k0Ig26zIrE-ODAcY0jHolqhLDVz-ZdSPdDrHhSS8QJvZ1tfNdOc14ucID3-CWwQ"/>
<div class="flex-grow">
<h3 class="font-title-md text-title-md text-on-surface">Tanvir Ahmed</h3>
<div class="flex items-center gap-1 font-label-md text-label-md text-on-surface-variant mt-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-semibold text-on-surface">4.8</span>
<span class="mx-1">•</span>
<span>Yamaha FZ</span>
</div>
</div>
<button aria-label="Call Rider" class="w-[48px] h-[48px] rounded-full bg-primary-container text-on-primary-container flex items-center justify-center hover:bg-primary transition-colors active:scale-95 shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex gap-3">
<button aria-label="Contact Support" class="flex-1 h-[56px] bg-surface rounded-xl border-2 border-primary text-primary font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">support_agent</span>
                    Support
                </button>
<button aria-label="Call Pharmacy" class="flex-1 h-[56px] bg-surface rounded-xl border-2 border-primary text-primary font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">local_pharmacy</span>
                    Pharmacy
                </button>
</div>
</div>
</div>
</body></html>
