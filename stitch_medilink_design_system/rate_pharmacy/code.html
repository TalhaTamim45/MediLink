<script>
        // Simple star rating logic
        function setupRating(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const stars = container.querySelectorAll('.material-symbols-outlined');
            
            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    const value = parseInt(e.target.dataset.value);
                    
                    stars.forEach((s, index) => {
                        if (index < value) {
                            s.classList.add('active');
                            s.classList.replace('text-outline-variant', 'text-[#f59e0b]');
                        } else {
                            s.classList.remove('active');
                            s.classList.replace('text-[#f59e0b]', 'text-outline-variant');
                        }
                    });
                });
            });
        }

        setupRating('pharmacy-rating');
        setupRating('rider-rating');
    </script>
