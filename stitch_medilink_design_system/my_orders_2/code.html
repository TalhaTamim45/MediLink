<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MediLink Bangladesh - My Orders</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "tertiary-fixed": "#e0e0ff",
                        "on-secondary-container": "#43647d",
                        "secondary": "#40627b",
                        "primary-container": "#008577",
                        "on-primary-fixed": "#00201c",
                        "inverse-primary": "#73d8c7",
                        "on-surface-variant": "#3e4946",
                        "secondary-fixed": "#c9e6ff",
                        "outline": "#6d7a76",
                        "inverse-on-surface": "#f1f1f1",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#274a62",
                        "on-primary-container": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#006a5e",
                        "surface-container-high": "#e8e8e8",
                        "surface-bright": "#f9f9f9",
                        "secondary-container": "#bee1fe",
                        "primary-fixed": "#90f4e3",
                        "error-container": "#ffdad6",
                        "on-background": "#1a1c1c",
                        "on-tertiary-container": "#ffffff",
                        "background": "#f9f9f9",
                        "on-primary-fixed-variant": "#005047",
                        "tertiary-fixed-dim": "#bdc2ff",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#656ec9",
                        "on-secondary-fixed": "#001e2f",
                        "surface-tint": "#006b5f",
                        "on-tertiary-fixed-variant": "#343d96",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed-dim": "#a8cbe7",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eeeeee",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e2",

                        "on-tertiary-fixed": "#000767",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-tablet": "32px",
                        "lg": "24px",
                        "touch-target": "48px",
                        "xl": "32px",
                        "sm": "8px",
                        "base": "8px",
                        "gutter": "16px",
                        "xxl": "48px",
                        "md": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }],

                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.25px", "fontWeight": "400" }],

                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]

            },
        }

<style>
        body { -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto md:border-x md:border-outline-variant md:shadow-lg relative pb-[80px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-background z-50">
<div class="flex justify-between items-center px-margin-mobile h-touch-target w-full z-50 bg-surface dark:bg-on-background">
<button aria-label="Back" class="w-touch-target h-touch-target flex items-center justify-start text-on-surface hover:bg-surface-container-low dark:hover:bg-surface-variant rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface truncate flex-1 text-center font-bold">My Orders</h1>
<div class="w-touch-target h-touch-target flex items-center justify-end"></div>
</div>
</header>
<!-- Tabs -->
<div class="px-margin-mobile pt-sm pb-md">
<div class="flex bg-surface-container rounded-lg p-1">
<button class="flex-1 py-2 text-center rounded-md bg-surface shadow-sm font-label-lg text-label-lg text-on-surface transition-all">Active</button>
<button class="flex-1 py-2 text-center rounded-md font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-low transition-all">History</button>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile flex flex-col gap-md pb-xl">
<!-- Order Card 1: In Transit -->
<article class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/30 flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Order #ML1024</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">3 items • ৳450</p>
</div>
<div class="bg-primary-container/10 px-3 py-1 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md text-primary font-semibold">In Transit</span>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-sm flex items-center gap-md">
<img alt="Delivery illustration" class="w-20 h-20 object-cover rounded-md" src="https://lh3.googleusercontent.com/aida/AP1WRLvIuNPjkU5Z1zJhxGTgBM7MC4ZWBNoACjpDufZbsAIQZp072DVgiw16HHNThkK67IBC5jMH1s8QkZkiNVGOK_OMx8tnpL7DGLFpwcGx9txETzZyHly_vvmPh0QgCbVf3T9Q5EJqcAqPpS0vkjDA5E_sP6CBlE5Wqj8wnddAb-QC6wmzCg6QqhCur86lGB_zsxod6fyRVfaSwnJ8akDkdxxSbIcw7yodQ4TCWZjiGlkBOxn3LzGnWQW8VME"/>
<div class="flex-1">
<p class="font-label-lg text-label-lg text-on-surface">Estimated Delivery</p>
<p class="font-title-md text-title-md text-primary mt-1">Today, 4:30 PM</p>
</div>
</div>
<div class="pt-sm border-t border-outline-variant/30">
<button class="w-full bg-primary text-on-primary h-touch-target rounded-xl font-label-lg text-label-lg font-semibold active:scale-[0.98] transition-transform">
                    Track Order
                </button>
</div>
</article>
<!-- Order Card 2: Processing -->
<article class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/30 flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Order #ML1021</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">1 item • ৳120</p>
</div>
<div class="bg-secondary-container/30 px-3 py-1 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-secondary">inventory_2</span>
<span class="font-label-md text-label-md text-secondary font-semibold">Processing</span>
</div>
</div>
<div class="flex gap-sm overflow-x-auto pb-2 snap-x">
<div class="w-16 h-16 shrink-0 bg-surface-container rounded-md flex items-center justify-center">
<span class="material-symbols-outlined text-outline">medication</span>
</div>
</div>
<div class="pt-sm border-t border-outline-variant/30 flex gap-sm">
<button class="flex-1 border-2 border-outline-variant text-on-surface-variant h-touch-target rounded-xl font-label-lg text-label-lg font-semibold active:bg-surface-container-low transition-colors">
                    View Details
                </button>
<button class="w-touch-target h-touch-target rounded-xl border-2 border-error/20 text-error flex items-center justify-center active:bg-error-container/20">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</article>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-on-background border-t border-outline-variant dark:border-outline shadow-md md:max-w-md md:left-1/2 md:-translate-x-1/2">
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-2 pb-safe md:max-w-md md:relative md:bottom-auto md:left-auto">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 rounded-2xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 rounded-2xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">map</span>
<span class="font-label-md text-label-md mt-1">Map</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed rounded-2xl px-4 py-1 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-md text-label-md mt-1 font-semibold">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 rounded-2xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</div>
</nav>
</body></html>
