<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediLink - My Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-variant": "#e2e2e2",

                        "on-primary-fixed": "#00201c",
                        "primary-fixed-dim": "#73d8c7",
                        "secondary": "#40627b",
                        "primary-container": "#008577",
                        "on-tertiary-container": "#ffffff",
                        "surface-container": "#eeeeee",
                        "on-secondary-fixed-variant": "#274a62",
                        "secondary-fixed": "#c9e6ff",
                        "on-primary-container": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9f9",
                        "on-primary-fixed-variant": "#005047",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#73d8c7",
                        "secondary-container": "#bee1fe",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-low": "#f3f3f3",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#3e4946",
                        "on-background": "#1a1c1c",
                        "secondary-fixed-dim": "#a8cbe7",
                        "tertiary": "#4c55ae",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "surface-tint": "#006b5f",
                        "on-secondary-fixed": "#001e2f",
                        "tertiary-fixed-dim": "#bdc2ff",
                        "primary": "#006a5e",
                        "surface-dim": "#dadada",
                        "on-surface": "#1a1c1c",
                        "on-secondary-container": "#43647d",
                        "tertiary-fixed": "#e0e0ff",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {

                        "xxl": "48px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "lg": "24px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {

                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.25px", "fontWeight": "400" }],

                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9; /* bg-background */
            color: #1a1c1c; /* text-on-background */
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #bdc9c5; /* outline-variant */
            border-radius: 10px;
        }
        /* Ensure bottom padding so content isn't hidden behind fixed bottom bar */
        main {
            padding-bottom: 120px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden global navigation) -->
<header class="w-full top-0 sticky z-40 bg-surface shadow-sm px-margin-mobile h-touch-target flex items-center justify-between">
<button aria-label="Go back" class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg font-bold text-primary">My Cart</h1>
<div class="h-touch-target w-touch-target"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-grow max-w-2xl mx-auto w-full px-margin-mobile pt-md flex flex-col gap-lg">
<!-- Cart Items Section -->
<section aria-labelledby="cart-items-heading" class="flex flex-col gap-sm">
<h2 class="sr-only" id="cart-items-heading">Cart Items</h2>
<!-- Card 1: Napa Extend -->
<article class="bg-surface-container-lowest rounded-xl p-md flex items-center gap-md shadow-sm border border-outline-variant/30">
<div class="w-[80px] h-[80px] rounded-lg bg-surface-container flex-shrink-0 overflow-hidden relative">
<img alt="Napa Extend 665mg" class="w-full h-full object-cover absolute inset-0" data-alt="A clean, brightly lit product photography shot of a single blister pack of Napa Extend 665mg tablets. The packaging is white with green text. The background is a soft, sterile white medical surface. The lighting is diffused and professional, casting soft shadows, emphasizing trustworthiness and clinical precision." src="https://lh3.googleusercontent.com/aida-public/AB6AXuACMQDFTR-0nGJrLX3x6no5WreuS1UP0r3ZlBSZmGLmp3FQeuz8U2B9iWgKksHIOgEHx2XxV-G1gAHkkLDVXlfcoi2WuN-jXkJSjrLMTpbNUzyZMU3puFMSmwiEfkV8lJOiVbLU4zn-4fexyZ_q0lVMjLt3loBRUK_F3EIzfw07heq5UzQMaDQbxaQdIN0Gy8RNT4dgl2S8SgfCh8W8uctlzstUKWKkGayZg-7CPfxZR_0lJw5xF1aJ6LgEJ6t6nX0PjNPcOsZQHZKs"/>
</div>
<div class="flex-grow flex flex-col gap-xs">
<h3 class="font-title-md text-title-md text-on-surface line-clamp-1">Napa Extend 665mg</h3>
<p class="font-body-md text-body-md text-primary font-semibold">৳40</p>
</div>
<div class="flex flex-col items-end gap-sm">
<button aria-label="Remove item" class="text-outline-variant hover:text-error transition-colors p-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
<!-- Stepper -->
<div class="flex items-center bg-surface-container rounded-full border border-outline-variant/50 h-10">
<button aria-label="Decrease quantity" class="w-10 h-full flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-l-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="w-8 text-center font-title-md text-title-md text-on-surface">2</span>
<button aria-label="Increase quantity" class="w-10 h-full flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-r-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</article>
<!-- Card 2: Sergel 20mg -->
<article class="bg-surface-container-lowest rounded-xl p-md flex items-center gap-md shadow-sm border border-outline-variant/30">
<div class="w-[80px] h-[80px] rounded-lg bg-surface-container flex-shrink-0 overflow-hidden relative">
<img alt="Sergel 20mg" class="w-full h-full object-cover absolute inset-0" data-alt="A clean, well-lit top-down product shot of a Sergel 20mg capsule box. The box has distinct pharmaceutical branding, sitting on a clean, light gray surface. Soft, professional lighting highlights the text on the box, ensuring it looks like a reliable medical product in a modern healthcare app setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCq7fB6JF9kQNNOD33c8G_zaLAMnsZyog7fE2pmYAp1tW5AjKmLDQbn1H_ET9vOW-0fbslUd378vR4ND5G0atwIDgPyxNOU-pCJxCxweyZV8ugstK8zvbmb8vATNAu129Pm6w1GQLHVzWpXjhQL48NS54O2Y5e-z4pCuzuy6TjOvOGy3m0u4ujVrIQqkPMGjKi4pCpFlKZDQLIW6dA7tLyRRyNC4uAm8ew9fK2vreJGnZzm4cQxb1ZPpvLu2eY5aQbHpSZ3T6Q2Qlcy"/>
</div>
<div class="flex-grow flex flex-col gap-xs">
<h3 class="font-title-md text-title-md text-on-surface line-clamp-1">Sergel 20mg</h3>
<p class="font-body-md text-body-md text-primary font-semibold">৳70</p>
</div>
<div class="flex flex-col items-end gap-sm">
<button aria-label="Remove item" class="text-outline-variant hover:text-error transition-colors p-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
<!-- Stepper -->
<div class="flex items-center bg-surface-container rounded-full border border-outline-variant/50 h-10">
<button aria-label="Decrease quantity" class="w-10 h-full flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-l-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="w-8 text-center font-title-md text-title-md text-on-surface">1</span>
<button aria-label="Increase quantity" class="w-10 h-full flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-r-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</article>
<button class="mt-sm flex items-center justify-center gap-sm text-primary font-label-lg text-label-lg py-sm px-md border-2 border-dashed border-primary/30 rounded-xl hover:bg-surface-container-low transition-colors min-h-[56px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
                Add more medicines
            </button>
</section>
<!-- Coupon Section -->
<section aria-labelledby="coupon-heading" class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/30">
<h2 class="sr-only" id="coupon-heading">Apply Coupon</h2>
<div class="flex items-center gap-sm">
<div class="relative flex-grow h-[56px]">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">local_offer</span>
<input class="w-full h-full pl-[48px] pr-md rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface outline-none font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="coupon-code" placeholder="Apply Coupon Code" type="text"/>
</div>
<button class="h-[56px] px-lg bg-surface-container text-primary font-label-lg text-label-lg rounded-xl hover:bg-surface-container-high transition-colors active:scale-95 font-semibold">
                    Apply
                </button>
</div>
</section>
<!-- Order Summary Section -->
<section aria-labelledby="summary-heading" class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/30 flex flex-col gap-sm mb-lg">
<h2 class="font-title-lg text-title-lg text-on-surface mb-xs" id="summary-heading">Order Summary</h2>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-body-md text-body-md text-on-surface font-medium">৳150</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
                    Delivery Fee
                    <span class="material-symbols-outlined text-[16px] text-outline" style="font-variation-settings: 'FILL' 0;">info</span>
</span>
<span class="font-body-md text-body-md text-on-surface font-medium">৳60</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
                    Platform Fee
                </span>
<span class="font-body-md text-body-md text-on-surface font-medium">৳25</span>
</div>
<hr class="border-t border-outline-variant/30 my-sm"/>
<div class="flex justify-between items-center">
<span class="font-title-lg text-title-lg text-on-surface font-bold">Total Amount</span>
<span class="font-title-lg text-title-lg text-primary font-bold">৳235</span>
</div>
</section>
</main>
<!-- Sticky Bottom Checkout Bar -->
<section aria-label="Checkout Actions" class="fixed bottom-0 w-full z-50 bg-surface shadow-[0_-4px_12px_rgba(0,0,0,0.05)] border-t border-outline-variant/20 rounded-t-xl px-margin-mobile py-md max-w-2xl left-1/2 -translate-x-1/2 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Total to pay</span>
<span class="font-headline-md text-headline-md text-primary font-bold">৳235</span>
</div>
<button class="bg-primary text-on-primary h-[56px] px-xl rounded-[16px] font-title-md text-title-md hover:bg-primary-container hover:shadow-md transition-all active:scale-95 flex items-center gap-sm">
            Proceed to Checkout
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</section>
</body></html>
