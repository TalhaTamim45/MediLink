                    Resend code in <span class="text-primary font-bold" id="timer">01:30</span>
</p>

                </button>

            </button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verifyBtn');
            const form = document.getElementById('otpForm');
            
            // Timer logic
            let timeLeft = 90; // 1:30 in seconds
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            const timerContainer = timerDisplay.parentElement;

            const updateTimer = () => {
                const minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timerDisplay.textContent = `0${minutes}:${seconds}`;

                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    timerContainer.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
                timeLeft--;
            };

            const timerInterval = setInterval(updateTimer, 1000);

            resendBtn.addEventListener('click', () => {
                timeLeft = 90;
                timerContainer.classList.remove('hidden');
                resendBtn.classList.add('hidden');
                updateTimer();
                const newInterval = setInterval(updateTimer, 1000);
                
                // Clear inputs
                inputs.forEach(input => {
                    input.value = '';
                    input.disabled = true;
                });
                inputs[0].disabled = false;
                inputs[0].focus();
                checkFormValidity();
            });

            // OTP Input Logic
            const checkFormValidity = () => {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                if (allFilled) {
                    verifyBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'pointer-events-none', 'opacity-60');
                    verifyBtn.classList.add('bg-primary', 'text-on-primary', 'active:scale-[0.98]', 'hover:bg-primary-fixed-variant');
                } else {
                    verifyBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'pointer-events-none', 'opacity-60');
                    verifyBtn.classList.remove('bg-primary', 'text-on-primary', 'active:scale-[0.98]', 'hover:bg-primary-fixed-variant');
                }
            };

            inputs.forEach((input, index) => {
                // Focus styling
                input.addEventListener('focus', () => {
                    input.classList.add('border-primary', 'ring-1', 'ring-primary');
                });
                input.addEventListener('blur', () => {
                    input.classList.remove('border-primary', 'ring-1', 'ring-primary');
                });

                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    input.value = input.value.replace(/[^0-9]/g, '');
                    
                    if (input.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].disabled = false;
                            inputs[index + 1].focus();
                        } else {
                            input.blur();
                        }
                    }
                    checkFormValidity();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index].disabled = true;
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    if(pastedData.length > 0) {
                        for(let i=0; i<pastedData.length; i++) {
                            if(inputs[i]) {
                                inputs[i].value = pastedData[i];
                                inputs[i].disabled = false;
                                if(i < inputs.length - 1) {
                                    inputs[i+1].disabled = false;
                                    inputs[i+1].focus();
                                }
                            }
                        }
                        checkFormValidity();
                    }
                });
            });

            // Auto focus first input
            setTimeout(() => {
                inputs[0].focus();
            }, 300);

            // Form Submit Simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-variation-settings: \'FILL\' 0;">progress_activity</span> Verifying...';
                
                setTimeout(() => {
                    verifyBtn.classList.remove('bg-primary', 'text-on-primary');
                    verifyBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">check_circle</span> Verified Successfully';
                    
                    // Simulate navigation away
                    setTimeout(() => {
                       // window.location.href = '#'; 
                    }, 1000);
                }, 1500);
            });
        });
    </script>
