<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MediLink - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-fixed-variant": "#005047",
                        "tertiary-fixed-dim": "#bdc2ff",
                        "outline": "#6d7a76",
                        "primary-fixed-dim": "#73d8c7",
                        "on-tertiary-fixed": "#000767",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "on-tertiary-fixed-variant": "#343d96",
                        "surface-container": "#eeeeee",
                        "secondary-fixed-dim": "#a8cbe7",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dadada",
                        "on-primary-fixed": "#00201c",
                        "on-background": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e8e8e8",
                        "on-tertiary-container": "#ffffff",
                        "on-surface-variant": "#3e4946",
                        "tertiary-fixed": "#e0e0ff",
                        "secondary-fixed": "#c9e6ff",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-container": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#43647d",
                        "primary-container": "#008577",
                        "primary-fixed": "#90f4e3",
                        "inverse-surface": "#2f3131",
                        "inverse-primary": "#73d8c7",
                        "secondary": "#40627b",
                        "on-secondary-fixed": "#001e2f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary": "#006a5e",
                        "surface-container-low": "#f3f3f3",
                        "on-secondary-fixed-variant": "#274a62",
                        "background": "#f9f9f9",
                        "outline-variant": "#bdc9c5",
                        "tertiary-container": "#656ec9",
                        "secondary-container": "#bee1fe",
                        "on-error-container": "#93000a",
                        "surface-tint": "#006b5f",
                        "surface": "#f9f9f9",
                        "tertiary": "#4c55ae",
                        "surface-variant": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "base": "8px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "touch-target": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "gutter": "16px",
                        "xxl": "48px",
                        "xs": "4px",
                        "margin-tablet": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "title-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .m3-input {
            position: relative;
            margin-bottom: 24px;
        }
        .m3-input input {
            width: 100%;
            height: 56px;
            padding: 16px 16px 0 16px;
            border: 1px solid theme('colors.outline');
            border-radius: theme('borderRadius.DEFAULT');
            background-color: transparent;
            color: theme('colors.on-surface');
            outline: none;
            transition: all 0.2s ease;
        }
        .m3-input input:focus {
            border: 2px solid theme('colors.primary');
            padding: 15px 15px 0 15px; /* Adjust padding to compensate for thicker border */
        }
        .m3-input label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: theme('colors.on-surface-variant');
            transition: all 0.2s ease;
            pointer-events: none;
            background-color: theme('colors.background');
            padding: 0 4px;
        }
        .m3-input input:focus ~ label,
        .m3-input input:not(:placeholder-shown) ~ label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            color: theme('colors.primary');
        }
        
        .m3-input.has-prefix input {
            padding-left: 64px;
        }
        .m3-input.has-prefix label {
            left: 64px;
        }
        .m3-input.has-prefix input:focus ~ label,
        .m3-input.has-prefix input:not(:placeholder-shown) ~ label {
            left: 12px;
        }
        
        .phone-prefix {
            position: absolute;
            left: 16px;
            top: 16px;
            color: theme('colors.on-surface');
            font-weight: 500;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Note: TopAppBar and BottomNavBar are suppressed for transactional pages (Login/Registration) as per guidelines -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-tablet">
<div class="w-full max-w-[450px] bg-surface-container-lowest rounded-2xl shadow-sm p-6 md:p-8 flex flex-col">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold mb-2">MediLink</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to continue</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col w-full" method="POST">
<!-- Full Name -->
<div class="m3-input">
<input class="font-body-md text-body-md" id="fullName" name="fullName" placeholder=" " required="" type="text"/>
<label class="font-label-md text-label-md" for="fullName">Full Name</label>
</div>
<!-- Phone Number -->
<div class="m3-input has-prefix">
<span class="phone-prefix font-body-md text-body-md">+880</span>
<input class="font-body-md text-body-md" id="phone" name="phone" pattern="[0-9]{10}" placeholder=" " required="" type="tel"/>
<label class="font-label-md text-label-md" for="phone">Phone Number</label>
</div>
<!-- Email (Optional but included per prompt) -->
<div class="m3-input">
<input class="font-body-md text-body-md" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="font-label-md text-label-md" for="email">Email</label>
</div>
<!-- Password -->
<div class="m3-input">
<input class="font-body-md text-body-md pr-12" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="font-label-md text-label-md" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-4 top-4 text-on-surface-variant hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-full p-1" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Confirm Password -->
<div class="m3-input mb-6">
<input class="font-body-md text-body-md pr-12" id="confirmPassword" name="confirmPassword" placeholder=" " required="" type="password"/>
<label class="font-label-md text-label-md" for="confirmPassword">Confirm Password</label>
</div>
<!-- Terms & Privacy -->
<div class="flex items-start mb-8 min-h-[48px]">
<div class="flex items-center h-6">
<input class="h-5 w-5 rounded border-outline text-primary focus:ring-primary focus:ring-2 focus:ring-offset-1 bg-surface-container-lowest cursor-pointer transition-colors duration-200" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm flex-1">
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="terms">
                            I agree to the <a class="text-primary font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Terms</a> &amp; <a class="text-primary font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Create Account Button -->
<button class="w-full min-h-[56px] h-touch-target bg-primary text-on-primary rounded-2xl font-title-md text-title-md font-semibold hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background transition-all duration-200 active:scale-[0.98] flex items-center justify-center" type="submit">
                    Create Account
                </button>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-title-md text-title-md hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded px-1 py-1 inline-flex items-center min-h-[48px] justify-center" href="#">
                        Login
                    </a>
</p>
</div>
</div>
</main>
</body></html>
