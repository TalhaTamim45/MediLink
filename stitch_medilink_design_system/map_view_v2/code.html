      /* Map marker pulse animation */

        0% { transform: scale(0.8); opacity: 0.8; }
        80% { transform: scale(2.5); opacity: 0; }

        content: '';

        left: -10px;
        top: -10px;
        right: -10px;
        bottom: -10px;
        border-radius: 50%;
        background-color: theme('colors.primary');
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        z-index: -1;
      }
