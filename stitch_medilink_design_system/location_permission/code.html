<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen flex flex-col antialiased">
<!-- Main Content Canvas (Transactional/Onboarding Flow - Navigation Suppressed) -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pb-xxl pt-margin-mobile relative z-10 max-w-md mx-auto w-full text-center">
<!-- Illustration Container -->
<div class="relative w-48 h-48 mb-xl flex items-center justify-center">
<!-- Pulsing background rings for map pin -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full pulse-ring" style="animation-delay: 0s;"></div>
<div class="absolute inset-4 bg-primary-container/30 rounded-full pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Map Pin Illustration -->
<div class="relative z-10 w-24 h-24 bg-primary rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    location_on
                </span>
</div>
<!-- Decorative floating dots -->
<div class="absolute top-4 right-4 w-3 h-3 bg-tertiary rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
<div class="absolute bottom-8 left-4 w-2 h-2 bg-secondary rounded-full animate-bounce" style="animation-delay: 0.7s;"></div>
<div class="absolute top-1/2 -right-2 w-2 h-2 bg-error rounded-full animate-bounce" style="animation-delay: 1.1s;"></div>
</div>
<!-- Text Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">
            Find Nearby Care
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-4">
            We use your location to find nearby verified pharmacies and estimate delivery.
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-md mt-auto mb-lg">
<!-- Primary Action -->
<button class="w-full min-h-[56px] bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center shadow-sm hover:bg-surface-tint transition-colors active:scale-95 touch-manipulation">
<span class="material-symbols-outlined mr-sm" style="font-variation-settings: 'FILL' 1;">my_location</span>
                Allow Location
            </button>
<!-- Secondary Action -->
<button class="w-full min-h-[56px] bg-surface border-2 border-primary text-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center hover:bg-surface-container transition-colors active:scale-95 touch-manipulation">
<span class="material-symbols-outlined mr-sm">map</span>
                Choose Location Manually
            </button>
<!-- Tertiary Action (Text Button) -->
<button class="w-full min-h-[48px] bg-transparent text-on-surface-variant font-label-lg text-label-lg rounded-xl flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95 touch-manipulation">
                Not Now
            </button>
</div>
</main>
<!-- Interactive script for button feedback (optional subtle touches) -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Simple ripple effect simulation
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.background = 'rgba(255,255,255,0.4)';
                ripple.style.borderRadius = '50%';
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.transform = 'translate(-50%, -50%) scale(0)';
                ripple.style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
                
                this.style.position = 'relative';
                this.style.overflow = 'hidden';
                this.appendChild(ripple);
                
                requestAnimationFrame(() => {
                    ripple.style.transform = 'translate(-50%, -50%) scale(10)';
                    ripple.style.opacity = '0';
                });
                
                setTimeout(() => ripple.remove(), 500);
            });
        });
    </script>
