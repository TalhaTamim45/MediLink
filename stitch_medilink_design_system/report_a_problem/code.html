<style>

<body class="bg-background min-h-screen flex flex-col items-center w-full overflow-x-hidden">
<!-- TopAppBar Semantic Shell - Linear Flow - No Nav -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky shadow-sm flex items-center justify-between px-margin-mobile h-touch-target z-50">
<div class="flex items-center">
<button aria-label="Go back" class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="flex-1 flex justify-center">
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed-dim">Report a Problem</h1>
</div>
<div class="flex items-center w-touch-target">
<!-- Empty space for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-margin-mobile py-lg flex-grow flex flex-col gap-lg">
<!-- Illustration Area -->
<section class="w-full flex justify-center items-center py-md">
<div class="w-48 h-48 sm:w-64 sm:h-64 rounded-2xl overflow-hidden bg-surface-container-low flex items-center justify-center">

</div>
</section>
<!-- Problem Categories -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface">What seems to be the issue?</h2>
<div class="flex flex-wrap gap-base">
<!-- Chips -->
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Late Delivery</button>
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Wrong Medicine</button>
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Damaged Package</button>
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Missing Items</button>
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Payment Issue</button>
<button class="px-md py-base rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high active:bg-secondary-container active:text-on-secondary-container active:border-transparent transition-all">Other</button>
</div>
</section>
<!-- Description Input -->
<section class="flex flex-col gap-sm">
<label class="font-title-md text-title-md text-on-surface" for="problem-description">Description</label>
<textarea class="w-full rounded-xl border border-outline-variant bg-surface p-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none transition-shadow" id="problem-description" placeholder="Please provide details about the problem..." rows="4"></textarea>
</section>
<!-- Attachment -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface">Attachments (Optional)</h2>
<button class="w-full min-h-[56px] rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center gap-base text-on-surface-variant active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-lg text-label-lg">Upload Image</span>
</button>
</section>
<!-- Actions -->
<section class="flex flex-col gap-md mt-auto pt-lg pb-xxl">
<button class="w-full min-h-[56px] bg-primary text-on-primary rounded-2xl font-title-md text-title-md flex items-center justify-center shadow-sm hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all">
                Submit Report
            </button>
<button class="w-full min-h-[56px] border-[2px] border-error text-error rounded-2xl font-title-md text-title-md flex items-center justify-center gap-sm hover:bg-error-container hover:text-on-error-container active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
                Emergency Call
            </button>
</section>
</main>
<script>
        // Simple script to toggle active state on chips for demonstration
        document.querySelectorAll('button').forEach(btn => {
            if(btn.textContent.match(/Late Delivery|Wrong Medicine|Damaged Package|Missing Items|Payment Issue|Other/)) {
                btn.addEventListener('click', function() {
                    this.classList.toggle('bg-secondary-container');
                    this.classList.toggle('text-on-secondary-container');
                    this.classList.toggle('border-transparent');
                    
                    this.classList.toggle('bg-surface');
                    this.classList.toggle('text-on-surface-variant');
                    this.classList.toggle('border-outline-variant');
                });
            }
        });
    </script>
